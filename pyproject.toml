[project]
name = "asset-pricing-polars-book"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "db2pq==0.2.8",
  "era-py[polars]==0.0.38",
  "jupyter",
  "plotnine-polars>=0.2.1",
  "polars>=1.30",
  "pyarrow",
  "statspai==1.46.3",
  "statsmodels",
]

[dependency-groups]
parity = [
  "pandas", "numpy", "scipy", "linearmodels",
  "rich", "tqdm", "deprecated", "openpyxl", "seaborn",
]

[tool.uv]
package = false
