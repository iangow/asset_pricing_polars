[project]
name = "asset-pricing-polars-book"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "db2pq==0.2.8",
  "eap-pl",
  "era-py[polars]==0.0.38",
  "jupyter",
  "plotnine-polars>=0.2.1",
  "polars>=1.30",
  "pyarrow",
  "statspai==1.46.3",
  "statsmodels",
]

[dependency-groups]
docs = ["quartodoc>=0.11,<0.12", "griffe<2"]
parity = [
  "pandas", "numpy", "scipy", "linearmodels",
  "rich", "tqdm", "deprecated", "openpyxl", "seaborn",
]

[tool.uv]
package = false

[tool.uv.sources]
eap-pl = { path = "packages/eap_pl", editable = true }
