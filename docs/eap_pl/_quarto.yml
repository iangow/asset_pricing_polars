project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - reference/*.qmd

metadata-files:
  - reference/_sidebar.yml

website:
  title: eap_pl
  site-url: https://iangow.github.io/eap_py/eap_pl/
  description: "Function reference for Empirical Asset Pricing: A Python Reader’s Companion"
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: reference/index.qmd
        text: Reference
    right:
      - text: Book
        href: https://iangow.github.io/eap_py/
      - icon: github
        href: https://github.com/iangow/eap_py/tree/main/packages/eap_pl

format:
  html:
    theme: cosmo
    code-copy: true
    toc: true
    css: reference/_styles-quartodoc.css

quartodoc:
  style: pkgdown
  package: eap_pl
  source_dir: ../../packages/eap_pl/src
  parser: google
  dir: reference
  title: Function reference
  sidebar:
    file: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  options:
    signature_name: full
  sections:
    - title: Data and Parquet
      contents:
        - name: load_parquet
          dynamic: true
        - load_annual_betas
        - load_monthly_betas
        - build_annual_panel
        - build_sizes
        - build_book_to_market
        - build_momentum
        - load_beta_universe
        - get_ff_factors
        - load_pastor_stambaugh_2013
        - load_daily_beta_inputs
        - monthly_panel
        - write_eap_table
        - name: ptime
          dynamic: true
    - title: Cross-sectional statistics
      contents:
        - mean_cross_sections
        - period_correlations
        - correlation_matrix
        - winsorized_corr
        - persistence
    - title: Time-series regressions
      contents:
        - rolling_ols
    - title: Portfolios and inference
      contents:
        - univariate_panel
        - bivariate_months
        - bivariate_panel
        - fama_macbeth_table
        - hac
        - format_fit
    - title: Plots
      contents:
        - plot_cumulative_returns
        - plot_factor
    - title: Polars expression methods
      contents:
        - name: EAPExprNamespace.ntile
          dynamic: true
        - name: EAPExprNamespace.winsorize
          dynamic: true
        - name: EAPExprNamespace.truncate
          dynamic: true
        - name: EAPExprNamespace.div_if_pos
          dynamic: true
    - title: DataFrame methods
      contents:
        - EAPDataFrameNamespace.show_table
        - EAPDataFrameNamespace.show_grid
        - name: EAPDataFrameNamespace.map_by
          dynamic: true
