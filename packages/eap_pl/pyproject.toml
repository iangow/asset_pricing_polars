[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "eap-pl"
version = "0.1.0"
description = "Polars helpers for Empirical Asset Pricing with Polars"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "era-py[polars]==0.0.38",
  "plotnine-polars>=0.2.1",
  "polars>=2.0",
  "statspai==1.46.3",
]

[project.urls]
Repository = "https://github.com/iangow/asset_pricing_polars"
Documentation = "https://iangow.github.io/asset_pricing_polars/eap_pl/"
