[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "eap-pl"
version = "0.1.0"
description = "Polars helpers for Empirical Asset Pricing: A Python Reader’s Companion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "era-py[polars]==0.0.38",
  "great-tables==1.1.0",
  "ipython",
  "numpy>=1.26",
  "plotnine-polars>=0.2.1",
  "polars>=2.0",
  "statspai==1.46.3",
]

[project.urls]
Repository = "https://github.com/iangow/eap_py"
Documentation = "https://iangow.github.io/eap_py/eap_pl/"
